name: Deploy Bot to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to VPS Rumahweb via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            # 1. Masuk ke folder bot di VPS
            cd /root/bot-discord-2026

            # 2. Ambil kod terkini dari GitHub (force reset untuk hindari konflik)
            git fetch origin main
            git reset --hard origin/main

            # 3. Pasang library baru jika ada (secara bersih)
            npm install --production

            # 4. Daftarkan slash commands baru jika ada
            npm run deploy

            # 5. Restart bot menggunakan PM2
            pm2 restart my-discord-bot || pm2 start index.js --name "my-discord-bot"
