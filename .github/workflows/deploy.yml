name: Deploy Bot to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            # 1. Tentukan target direktori di home user VPS
            TARGET_DIR="$HOME/bot-discord-2026"

            # 2. Buat folder jika belum ada dan kloring repositori menggunakan GITHUB_TOKEN
            if [ ! -d "$TARGET_DIR" ]; then
              echo "-> Folder target belum ada. Meng-clone repositori..."
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/joefany86-design/bot-discord-2026.git "$TARGET_DIR"
            fi

            cd "$TARGET_DIR"

            # 3. Perbarui URL remote agar menggunakan token terbaru untuk sesi ini
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/joefany86-design/bot-discord-2026.git

            # 4. Ambil kode terkini
            echo "-> Mengambil update terbaru dari GitHub..."
            git fetch origin main
            git reset --hard origin/main

            # 4.5. Buat direktori data dan file .env dari secrets GitHub jika ada
            mkdir -p data
            if [ -n "${{ secrets.DOTENV }}" ]; then
              echo "-> Menulis file .env dari GitHub Secrets..."
              echo "${{ secrets.DOTENV }}" > .env
            else
              echo "-> WARNING: secrets.DOTENV tidak ditemukan. Pastikan file .env sudah ada di VPS."
            fi

            # 4.7. Load NVM / pasang Node.js & PM2 jika belum ada di VPS
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            if ! command -v node &> /dev/null; then
              echo "-> Node.js tidak ditemukan. Menginstal NVM & Node.js 22..."
              curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
              export NVM_DIR="$HOME/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
              nvm install 22
              nvm use 22
              nvm alias default 22
            fi

            if ! command -v pm2 &> /dev/null; then
              echo "-> PM2 tidak ditemukan. Menginstal PM2..."
              npm install -g pm2
            fi

            # 5. Pasang dependencies
            echo "-> Memasang dependencies..."
            npm install --production

            # 6. Reload PM2 (atau start jika belum berjalan)
            echo "-> Mereload / memulai ulang bot via PM2..."
            pm2 reload ecosystem.config.js --update-env || pm2 start ecosystem.config.js --update-env
            pm2 save

